set -g prefix C-a

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g mode-keys vi
set-option -g renumber-windows on
set -s set-clipboard on

# Make vim colors work properly, seems to only be necessary in alacritty
# but also does not appear to hurt ghostty.
set -g default-terminal "tmux-256color"

# Enable undercurl and color.
set -ga terminal-features ",*:usstyle"

# Support RGB color with SGR escape sequences.
set -gs terminal-overrides ",*:RGB"

# Turn on hyperlink support
set -ga terminal-features "*:hyperlinks"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'o0th/tmux-nova'
set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Continuum hijacks status-right to trigger its periodic save, so it must be
# the last @plugin loaded — otherwise tmux-nova (a status-line theme) later
# regenerates status-right and wipes out continuum's hook.
set -g @plugin 'tmux-plugins/tmux-continuum'

# Optional configurations with their default values if omitted:

set -g @smart-splits_no_wrap '' # to disable wrapping. (any value disables wrapping)

set -g @smart-splits_move_left_key  'C-h' # key-mapping for navigation.
set -g @smart-splits_move_down_key  'C-j' #  --"--
set -g @smart-splits_move_up_key    'C-k' #  --"--
set -g @smart-splits_move_right_key 'C-l' #  --"--

set -g @smart-splits_resize_left_key  'M-h' # key-mapping for resizing.
set -g @smart-splits_resize_down_key  'M-j' #  --"--
set -g @smart-splits_resize_up_key    'M-k' #  --"--
set -g @smart-splits_resize_right_key 'M-l' #  --"--

set -g @nova-rows 0
set -g @nova-nerdfonts false

set -g @nova-pane "#I #W"

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=#e0af68]#[bg=#1f2335]#[fg=#1f2335]#[bg=#e0af68]"
set -g @prefix_highlight_output_suffix ""

# Colors from tokyonight-storm
base_bg="#24283b"
active_bg="#414868"
active_fg="#7dcfff"
base_fg="#7aa2f7"

pane_separator="$active_bg"
pane_separator_active="#8db0ff"

set -g message-style "fg=$active_fg,bg=$active_bg"
set -g message-command-style "fg=$active_fg,bg=$active_bg"

set -gw window-status-current-style bold
set -g "@nova-status-style-bg" "$base_bg"
set -g "@nova-status-style-fg" "$base_fg"
set -g "@nova-status-style-active-bg" "$base_bg"
set -g "@nova-status-style-active-fg" "$active_fg"

set -g @nova-segment-prefix "#{?client_prefix,PREFIX,}"
set -g @nova-segment-prefix-colors "$base_bg"

set -g @nova-segment-session "(⌐■_■)"
set -g @nova-segment-session-colors "$active_fg"

set -g status-right-length 120

set -g @nova-segment-spotify "#($HOME/dotfiles/scripts/spotify-now-playing.sh)"
set -g @nova-segment-spotify-colors "$base_bg $active_fg"

set -g @nova-segments-0-left "session"
set -g @nova-segments-0-right "spotify"
set -g @nova-pane-active-border-style "$pane_separator_active"
set -g @nova-pane-border-style "$pane_separator"

# Mirror the sesssion + window name to the terminal window title
set-option -g set-titles on
set-option -g set-titles-string "(⌐■_■) / #W"

# Open new windows and splits in the CWD
bind  c  new-window      -c "#{pane_current_path}"
bind  %  if -F '#{window_zoomed_flag}' 'display "Ignoring split, you are zoomed"' 'split-window -h -c "#{pane_current_path}"'
bind '"' if -F '#{window_zoomed_flag}' 'display "Ignoring split, you are zoomed"' 'split-window -v -c "#{pane_current_path}"'

# Set the pane name to the cwd
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# On new session: open vim and create a split
set-hook -g session-created \
  'send-keys nvim Enter; split-window -h -c "#{pane_current_path}"; resize-pane -x 40%; select-pane -t 1'

# tmux-resurrect creates sessions during restore too, which would otherwise
# trigger the hook above and race its own pane setup with an unwanted nvim
# split. Disable it for the duration of a restore, then restore it after.
set -g @resurrect-hook-pre-restore-all "tmux set-hook -gu session-created"
set -g @resurrect-hook-post-restore-all "tmux set-hook -g session-created 'send-keys nvim Enter; split-window -h -c \"#{pane_current_path}\"; resize-pane -x 40%; select-pane -t 1'"

# Highlight active tab when a pane is zoomed
set-hook -g after-resize-pane "if-shell 'tmux list-panes -F \"#{window_zoomed_flag}\" | grep -q 1' \
  'set -g window-status-current-format \"#[fg=#24283b,bg=#ffffff,bold] #I #W \" ; \
   set -w window-status-current-format \"#[fg=#24283b,bg=#ffffff,bold] #I #W \"' \
  'set -g window-status-current-format \"#[fg=#7dcfff]#[bg=#24283b] #I #W \" ; \
   set -wu window-status-current-format'"

# --- tmux-resurrect / tmux-continuum -----------------------------------------
# Survive devbox overnight suspension: continuum autosaves every minute and
# restores automatically on tmux server start, resurrect does the actual
# save/restore and can relaunch Claude Code / Codex sessions.

# Also capture visible pane text, not just process/cwd, on save.
set -g @resurrect-capture-pane-contents 'on'

# Resume Claude Code / Codex sessions on restore instead of a bare shell.
set -g @resurrect-processes '"~claude->claude -c" "~codex->codex resume --last"'

# Reopen nvim's buffers/layout on restore via vim-obsession's Session.vim,
# if one was saved (see nvim/lua/plugins/obsession.lua).
set -g @resurrect-strategy-nvim 'session'

set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'

source-file -q ~/.tmux.conf.local

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
